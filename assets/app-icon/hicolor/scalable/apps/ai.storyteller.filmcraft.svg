<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="squircle">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151728"/>
      <stop offset="45%" stop-color="#0f111d"/>
      <stop offset="100%" stop-color="#07080f"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="url(#bgGrad)"/>

    <!-- Sweeping "C" / "G" monogram -->
    <path d="M 334 162
             C 294 120, 202 116, 154 164
             C 104 214, 104 298, 154 348
             C 202 396, 294 392, 344 348
             L 344 266
             L 252 266"
          fill="none"
          stroke="url(#arcGrad)"
          stroke-width="40"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Timeline grid clips -->
    <rect x="196" y="196" width="52" height="24" rx="4" fill="url(#violetGrad)"/>
    <rect x="256" y="196" width="74" height="24" rx="4" fill="url(#cyanGrad)"/>
    <rect x="178" y="228" width="66" height="24" rx="4" fill="url(#goldGrad)"/>
    <rect x="252" y="228" width="92" height="24" rx="4" fill="url(#rubyGrad)"/>
    <rect x="190" y="296" width="74" height="22" rx="4" fill="url(#cyanGrad)"/>
    <rect x="272" y="296" width="56" height="22" rx="4" fill="url(#violetGrad)"/>

    <!-- Playhead -->
    <line x1="246" y1="180" x2="246" y2="332" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <polygon points="236,176 256,176 246,190" fill="#ffffff"/>
    <polygon points="236,336 256,336 246,322" fill="#ffffff"/>
  </g>
</svg>
