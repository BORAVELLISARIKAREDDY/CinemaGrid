<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="squircle">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151728"/>
      <stop offset="45%" stop-color="#0f111d"/>
      <stop offset="100%" stop-color="#07080f"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridBackdrop" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.028)" stroke-width="1"/>
    </pattern>
    <filter id="playheadGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Base dark cinema canvas -->
    <rect width="512" height="512" fill="url(#bgGrad)"/>
    <!-- Precision editor grid pattern -->
    <rect width="512" height="512" fill="url(#gridBackdrop)"/>
    <!-- Subtle ambient glow -->
    <circle cx="256" cy="256" r="230" fill="url(#centerGlow)"/>

    <!-- Cinematic Viewfinder Reticle / Corner Brackets -->
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85">
      <!-- Top-left -->
      <path d="M 88 136 L 88 100 Q 88 92 96 92 L 132 92"/>
      <!-- Top-right -->
      <path d="M 380 92 L 416 92 Q 424 92 424 100 L 424 136"/>
      <!-- Bottom-left -->
      <path d="M 88 376 L 88 412 Q 88 420 96 420 L 132 420"/>
      <!-- Bottom-right -->
      <path d="M 380 420 L 416 420 Q 424 420 424 412 L 424 376"/>
    </g>

    <!-- 16:9 Scope Guides -->
    <g stroke="#475569" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
      <line x1="78" y1="168" x2="102" y2="168"/>
      <line x1="410" y1="168" x2="434" y2="168"/>
      <line x1="78" y1="344" x2="102" y2="344"/>
      <line x1="410" y1="344" x2="434" y2="344"/>
    </g>

    <!-- Film Perforation Notches on Left & Right Flanks (Cinema Motif) -->
    <g fill="#334155" opacity="0.45">
      <rect x="74" y="210" width="8" height="14" rx="2"/>
      <rect x="74" y="248" width="8" height="14" rx="2"/>
      <rect x="74" y="286" width="8" height="14" rx="2"/>
      <rect x="430" y="210" width="8" height="14" rx="2"/>
      <rect x="430" y="248" width="8" height="14" rx="2"/>
      <rect x="430" y="286" width="8" height="14" rx="2"/>
    </g>

    <!-- The CinemaGrid Monogram ("C" + "G" + Timeline Grid) -->
    <!-- Sweeping "C" and outer perimeter of "G" -->
    <path d="M 334 162
             C 294 120, 202 116, 154 164
             C 104 214, 104 298, 154 348
             C 202 396, 294 392, 344 348
             L 344 266
             L 252 266"
          fill="none"
          stroke="url(#arcGrad)"
          stroke-width="36"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Internal Timeline Grid Clips (Blocks representing video & audio tracks) -->
    <!-- Track V2 (Top) -->
    <rect x="194" y="194" width="50" height="22" rx="4" fill="url(#violetGrad)"/>
    <rect x="252" y="194" width="76" height="22" rx="4" fill="url(#cyanGrad)"/>

    <!-- Track V1 (Hero / Middle cut) -->
    <rect x="174" y="224" width="68" height="22" rx="4" fill="url(#goldGrad)"/>
    <rect x="250" y="224" width="94" height="22" rx="4" fill="url(#rubyGrad)"/>

    <!-- Track A1 (Audio Bottom) -->
    <rect x="186" y="294" width="76" height="20" rx="4" fill="url(#cyanGrad)"/>
    <rect x="270" y="294" width="58" height="20" rx="4" fill="url(#violetGrad)"/>

    <!-- Playhead Vertical Line with Diamond Heads -->
    <g filter="url(#playheadGlow)">
      <line x1="246" y1="172" x2="246" y2="338" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Top playhead needle -->
      <polygon points="238,170 254,170 246,182" fill="#ffffff"/>
      <!-- Bottom playhead needle -->
      <polygon points="238,340 254,340 246,328" fill="#ffffff"/>
    </g>

    <!-- Precise Grid Point Alignment Accents -->
    <circle cx="246" cy="205" r="2.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="246" cy="235" r="2.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="246" cy="304" r="2.5" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>