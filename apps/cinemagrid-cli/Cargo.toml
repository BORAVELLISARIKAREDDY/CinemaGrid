[package]
name = "cinemagrid-cli"
description = "CinemaGrid headless CLI and MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "cinemagrid-cli"
path = "src/main.rs"

[features]
default = []
# Speech-to-text (Text panel ▸ Transcribe) with Whisper on the CPU, and model downloads.
whisper = ["cinemagrid-engine/whisper", "cinemagrid-engine/speech-download"]

[dependencies]
cinemagrid-engine = { workspace = true }
cinemagrid-export = { workspace = true }
cinemagrid-project = { workspace = true }
cinemagrid-render = { workspace = true }
cinemagrid-time = { workspace = true }
cinemagrid-gpu = { workspace = true }
cinemagrid-media = { workspace = true }
cinemagrid-codecs = { workspace = true }
cinemagrid-platform = { workspace = true }
cinemagrid-mxf = { workspace = true }
cinemagrid-mpegts = { workspace = true }
cinemagrid-ogg = { workspace = true }
cinemagrid-automation = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
cinemagrid-testkit = { workspace = true }
