# Unsigned, self-contained release build for this fork.
#
# Unlike .github/workflows/release.yml (which delegates to the shared
# storytold/craft-common-actions pipeline and needs Apple/Windows signing secrets in the `release`
# environment), this workflow runs the packaging scripts directly on GitHub's macOS, Windows and
# Linux runners, signs nothing, and attaches the artifacts to a GitHub Release. See docs/releasing.md.
#
# Triggers:
#   * Actions > Release (unsigned) > Run workflow  (optional version override)
#   * pushing a tag:  git tag v0.8.0 && git push origin v0.8.0
#
# The macOS app is ad-hoc signed (not notarized), so users right-click > Open the first time; the
# Windows MSI is unsigned, so SmartScreen warns on first run.
name: Release (unsigned)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.8.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-unsigned-${{ github.ref }}
  cancel-in-progress: false

# The craft-fonts ref (abb83316…) is repeated in each build job's "Check out craft-fonts" step;
# bump all three together and keep them in sync with release.yml's craft-fonts-ref input.

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      override: ${{ steps.resolve.outputs.override }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cargo_version="$(awk '
            /^\[/ { in_pkg = ($0 == "[workspace.package]") ; next }
            in_pkg && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }
          ' Cargo.toml)"
          if [ -z "$cargo_version" ]; then
            echo "::error::could not read [workspace.package] version from Cargo.toml"
            exit 1
          fi
          if [ -n "${INPUT_VERSION:-}" ]; then
            version="$INPUT_VERSION"
            override=true
          else
            version="$cargo_version"
            override=false
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            if [ "$tag" != "v$version" ]; then
              echo "::error::tag $tag does not match version v$version; bump [workspace.package] version or retag"
              exit 1
            fi
          else
            tag="v$version"
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "override=$override"
          } >>"$GITHUB_OUTPUT"
          {
            echo "### CinemaGrid v$version"
            echo
            echo "- tag: \`$tag\`"
            echo "- pre-release: $prerelease"
          } >>"$GITHUB_STEP_SUMMARY"

  macos:
    name: macOS universal (unsigned)
    needs: version
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out craft-fonts
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-macos-universal
      - name: Apply version override
        if: needs.version.outputs.override == 'true'
        run: cargo xtask version set "$VERSION"
      - name: Build and package (ad-hoc signed, not notarized)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/macos/package.sh --arch universal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/release/*
          if-no-files-found: error

  windows:
    name: Windows x64 (unsigned)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out craft-fonts
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-windows-x64
      - name: Apply version override
        if: needs.version.outputs.override == 'true'
        shell: pwsh
        run: cargo xtask version set "$env:VERSION"
      - name: Install WiX
        uses: storytold/craft-common-actions/actions/install-wix@main
      - name: Build and package (unsigned)
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x64
          path: dist/release/*
          if-no-files-found: error

  linux:
    name: Linux x86_64
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out craft-fonts
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
      - uses: storytold/craft-common-actions/actions/install-linux-deps@main
        with:
          deb-arch: amd64
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux-x86_64
      - name: Apply version override
        if: needs.version.outputs.override == 'true'
        run: cargo xtask version set "$VERSION"
      - name: Build and package (AppImage, deb, rpm, tar.gz)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/linux/package.sh --formats "appimage deb rpm tar"
      - name: Check the packages
        run: |
          dpkg-deb --info dist/release/*.deb || true
          dpkg-deb --contents dist/release/*.deb | grep -E 'usr/bin/|metainfo|applications' || true
          for appimage in dist/release/*.AppImage; do
            if [ -f "$appimage" ]; then
              chmod +x "$appimage"
              APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version || true
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-x86_64
          path: dist/release/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [version, macos, windows, linux]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/release
          merge-multiple: true
      - name: Write checksums
        working-directory: dist/release
        run: |
          sha256sum ./* >SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          title="CinemaGrid v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/release/* --clobber
            gh release edit "$TAG" --title "$title" --prerelease="$PRERELEASE"
          else
            target_args=()
            # A pushed tag already exists; only point gh at a commitish when it must create the tag.
            if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              target_args=(--target "$GITHUB_SHA")
            fi
            gh release create "$TAG" \
              --title "$title" \
              --prerelease="$PRERELEASE" \
              --generate-notes \
              ${target_args[@]+"${target_args[@]}"} \
              dist/release/*
          fi
          echo "### Released $title" >>"$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >>"$GITHUB_STEP_SUMMARY"
