[package]
name = "cinemagrid-export"
description = "Export pipeline: parallel render → encode → mux, presets, progress/cancel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cinemagrid-time = { workspace = true }
cinemagrid-frame = { workspace = true }
cinemagrid-color = { workspace = true }
cinemagrid-media = { workspace = true }
cinemagrid-project = { workspace = true }
cinemagrid-render = { workspace = true }
cinemagrid-audio-dsp = { workspace = true }
cinemagrid-geom = { workspace = true }
cinemagrid-text = { workspace = true }
cinemagrid-isobmff = { workspace = true }
cinemagrid-prores = { workspace = true }
cinemagrid-dnx = { workspace = true }
cinemagrid-apv = { workspace = true }
cinemagrid-mxf = { workspace = true }
cinemagrid-aac = { workspace = true }
cinemagrid-flac = { workspace = true }
cinemagrid-h264enc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp"] }

[dev-dependencies]
cinemagrid-testkit = { workspace = true }
cinemagrid-codecs = { workspace = true }
