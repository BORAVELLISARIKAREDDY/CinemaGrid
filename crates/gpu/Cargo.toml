[package]
name = "cinemagrid-gpu"
description = "wgpu compositor: YUV/RGB layer sampling, linear-light premultiplied compositing in WGSL"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cinemagrid-color = { workspace = true }
cinemagrid-frame = { workspace = true }
cinemagrid-geom = { workspace = true }
cinemagrid-project = { workspace = true }
cinemagrid-render = { workspace = true }
cinemagrid-time = { workspace = true }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
log = { workspace = true }
pollster = "0.4"
rayon = { workspace = true }

[dev-dependencies]
pollster = "0.4"
cinemagrid-export = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
cinemagrid-media = { workspace = true }
cinemagrid-time = { workspace = true }
