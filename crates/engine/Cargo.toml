[package]
name = "cinemagrid-engine"
description = "CinemaGrid engine façade: session, command registry, history, media pool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Speech-to-text with Whisper (candle, CPU). Off by default and in wasm builds.
whisper = ["cinemagrid-speech/whisper"]
# Speech-model downloads over HTTPS.
speech-download = ["cinemagrid-speech/download"]
# Natural voices for Text to Speech: Kokoro-82M on candle (CPU) and their download.
neural-voices = ["cinemagrid-tts/kokoro", "speech-download"]

[dependencies]
cinemagrid-time = { workspace = true }
cinemagrid-geom = { workspace = true }
cinemagrid-color = { workspace = true }
cinemagrid-frame = { workspace = true }
cinemagrid-media = { workspace = true }
cinemagrid-codecs = { workspace = true }
cinemagrid-project = { workspace = true }
cinemagrid-edit = { workspace = true }
cinemagrid-render = { workspace = true }
cinemagrid-scopes = { workspace = true }
cinemagrid-text = { workspace = true }
cinemagrid-audio-dsp = { workspace = true }
cinemagrid-export = { workspace = true }
cinemagrid-mxf = { workspace = true }
cinemagrid-format = { workspace = true }
cinemagrid-interchange = { workspace = true }
cinemagrid-captions = { workspace = true }
cinemagrid-speech = { workspace = true }
cinemagrid-tts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
web-time = "1"

[dev-dependencies]
cinemagrid-testkit = { workspace = true }
cinemagrid-dng = { workspace = true, features = ["writer"] }
cinemagrid-isobmff = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
