[package]
name = "cinemagrid-codecs"
description = "Container + codec hub: MP4/MOV, Matroska, MXF, Ogg and MPEG TS/PS sources, image sequences, GOP-aware seeking, decoder registry, audio decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cinemagrid-time = { workspace = true }
cinemagrid-color = { workspace = true }
cinemagrid-frame = { workspace = true }
cinemagrid-media = { workspace = true }
cinemagrid-avi = { workspace = true }
cinemagrid-isobmff = { workspace = true }
cinemagrid-matroska = { workspace = true }
cinemagrid-mxf = { workspace = true }
cinemagrid-mpegts = { workspace = true }
cinemagrid-mpeg2v = { workspace = true }
cinemagrid-ac3 = { workspace = true }
cinemagrid-mpa = { workspace = true }
cinemagrid-ogg = { workspace = true }
cinemagrid-bitstream = { workspace = true }
cinemagrid-h264 = { workspace = true }
cinemagrid-hevc = { workspace = true }
cinemagrid-vp8 = { workspace = true }
cinemagrid-vp9 = { workspace = true }
cinemagrid-prores = { workspace = true }
cinemagrid-dnx = { workspace = true }
cinemagrid-av1 = { workspace = true }
cinemagrid-apv = { workspace = true }
cinemagrid-aac = { workspace = true }
cinemagrid-opus = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Decode timing counters (`gop_stats`); std's Instant panics on wasm32.
web-time = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Bootstrap audio decoding (MPL-2.0, used unmodified); replaced by own decoders over time.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "mp1", "mp2", "mp3", "flac", "alac", "pcm", "wav", "aiff", "ogg", "vorbis", "isomp4"] }

[dev-dependencies]
cinemagrid-testkit = { workspace = true }
serde_json = { workspace = true }
