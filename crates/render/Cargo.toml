[package]
name = "cinemagrid-render"
description = "Sequence evaluation and CPU reference compositor (linear-light premultiplied f32)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cinemagrid-time = { workspace = true }
cinemagrid-geom = { workspace = true }
cinemagrid-color = { workspace = true }
cinemagrid-frame = { workspace = true }
cinemagrid-media = { workspace = true }
cinemagrid-project = { workspace = true }
cinemagrid-audio-dsp = { workspace = true }
cinemagrid-captions = { workspace = true }
cinemagrid-text = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

# Thread CPU clock for load-robust performance tests.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
