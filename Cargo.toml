[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/cinemagrid"

[workspace.dependencies]
# internal
cinemagrid-time = { path = "crates/time" }
cinemagrid-geom = { path = "crates/geom" }
cinemagrid-color = { path = "crates/color" }
cinemagrid-bitstream = { path = "crates/bitstream" }
cinemagrid-isobmff = { path = "crates/isobmff" }
cinemagrid-avi = { path = "crates/avi" }
cinemagrid-matroska = { path = "crates/matroska" }
cinemagrid-mxf = { path = "crates/mxf" }
cinemagrid-cfb = { path = "crates/cfb" }
cinemagrid-mpegts = { path = "crates/mpegts" }
cinemagrid-mpeg2v = { path = "crates/mpeg2v" }
cinemagrid-ac3 = { path = "crates/ac3" }
cinemagrid-mpa = { path = "crates/mpa" }
cinemagrid-ogg = { path = "crates/ogg" }
cinemagrid-h264 = { path = "crates/h264" }
cinemagrid-hevc = { path = "crates/hevc" }
cinemagrid-vp8 = { path = "crates/vp8" }
cinemagrid-vp9 = { path = "crates/vp9" }
cinemagrid-prores = { path = "crates/prores" }
cinemagrid-dnx = { path = "crates/dnx" }
cinemagrid-apv = { path = "crates/apv" }
cinemagrid-dng = { path = "crates/dng" }
cinemagrid-av1 = { path = "crates/av1" }
cinemagrid-aac = { path = "crates/aac" }
cinemagrid-flac = { path = "crates/flac" }
cinemagrid-opus = { path = "crates/opus" }
cinemagrid-h264enc = { path = "crates/h264enc" }
cinemagrid-audio-dsp = { path = "crates/audio-dsp" }
cinemagrid-frame = { path = "crates/frame" }
cinemagrid-media = { path = "crates/media" }
cinemagrid-codecs = { path = "crates/codecs" }
cinemagrid-project = { path = "crates/project" }
cinemagrid-edit = { path = "crates/edit" }
cinemagrid-interchange = { path = "crates/interchange" }
cinemagrid-text = { path = "crates/text" }
cinemagrid-captions = { path = "crates/captions" }
cinemagrid-speech = { path = "crates/speech" }
cinemagrid-tts = { path = "crates/tts" }
cinemagrid-tts-text = { path = "crates/tts-text" }
cinemagrid-render = { path = "crates/render" }
cinemagrid-gpu = { path = "crates/gpu" }
cinemagrid-scopes = { path = "crates/scopes" }
cinemagrid-export = { path = "crates/export" }
cinemagrid-format = { path = "crates/format" }
cinemagrid-engine = { path = "crates/engine" }
cinemagrid-ui-egui = { path = "crates/ui-egui" }
cinemagrid-automation = { path = "crates/automation" }
cinemagrid-platform = { path = "crates/platform" }
cinemagrid-testkit = { path = "crates/testkit" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
rayon = "1"
proptest = "1"
roxmltree = "0.21"
craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "82a24b006eefa036b43c09a67fb9a3fbd17ffe63" }

# ui
# Shared frontend components; keep this dependency above the engine boundary.
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# Codec hot loops: debug-build tests (RFC/oracle vectors) are minutes slower below opt-level 3.
[profile.dev.package.cinemagrid-h264]
opt-level = 3

[profile.dev.package.cinemagrid-h264enc]
opt-level = 3

[profile.dev.package.cinemagrid-hevc]
opt-level = 3

[profile.dev.package.cinemagrid-prores]
opt-level = 3

[profile.dev.package.cinemagrid-dnx]
opt-level = 3

[profile.dev.package.cinemagrid-apv]
opt-level = 3

[profile.dev.package.cinemagrid-dng]
opt-level = 3

[profile.dev.package.cinemagrid-av1]
opt-level = 3

[profile.dev.package.cinemagrid-aac]
opt-level = 3

[profile.dev.package.cinemagrid-flac]
opt-level = 3

# Audio effects: realtime-factor tests and long convolution / spectral runs.
[profile.dev.package.cinemagrid-audio-dsp]
opt-level = 3

[profile.dev.package.cinemagrid-mxf]
opt-level = 3

[profile.dev.package.cinemagrid-opus]
opt-level = 3

[profile.dev.package.cinemagrid-vp8]
opt-level = 3

[profile.dev.package.cinemagrid-vp9]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
